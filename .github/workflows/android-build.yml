name: Build Hydra APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Hydra APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Verify Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "Using Android SDK: ${SDK_ROOT}"
          test -d "${SDK_ROOT}/platforms/android-35"
          test -d "${SDK_ROOT}/build-tools/36.0.0"
          echo "Android SDK verification passed."

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.4.1'

      - name: Verify project compatibility settings
        shell: bash
        run: |
          set -euo pipefail
          grep -n 'compileSdk = 35' app/build.gradle.kts
          grep -n 'compose-bom:2025.02.00' app/build.gradle.kts
          grep -n 'core-ktx:1.15.0' app/build.gradle.kts
          grep -n 'activity-compose:1.10.0' app/build.gradle.kts
          if grep -RIn --include='*.gradle' --include='*.gradle.kts' \
              'org.jetbrains.kotlin.android\|kotlin-android' .; then
            echo 'Legacy kotlin-android plugin detected. AGP 9 uses built-in Kotlin.'
            exit 1
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:assembleDebug --stacktrace --info 2>&1 | tee build.log

      - name: Verify APK exists
        if: success()
        shell: bash
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: Hydra-v1.0.5-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: Hydra-v1.0.5-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 14
